<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>iPhone drop zone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="zone">
  <div class="zone-box">
    <svg width="28" height="44" viewBox="0 0 28 44" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="26" height="42" rx="5" stroke="#0066cc" stroke-width="1.5"></rect>
      <path d="M11 38h6" stroke="#0066cc" stroke-width="1.5" stroke-linecap="round"></path>
    </svg>
    <h1>Drag a window here</h1>
    <p>Whatever covers this box is what the iPhone sees. Resize the box to change it.</p>
    <span id="size" class="zone-size"></span>
  </div>
  <script>
    const size = document.getElementById('size');
    const show = () => (size.textContent = `${innerWidth} × ${innerHeight}`);
    addEventListener('resize', show);
    show();
  </script>
</body>
</html>
